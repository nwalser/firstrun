[package]
name = "firstrun-sdk"
version = "0.1.0"
edition = "2021"
description = "Analytics for a Tauri desktop app: an anonymous per-install id and a bounded entry queue, in memory by default."
publish = false
license = "LicenseRef-Proprietary"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
uuid = { version = "1", features = ["v4"] }
dirs = "5"

[dev-dependencies]
tempfile = "3"
