[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "firstrun"
version = "0.1.0"
description = "Fire-and-forget analytics client for firstrun. Never blocks, never raises, never in your critical path."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["analytics", "telemetry", "firstrun"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Monitoring",
  "Typing :: Typed",
]

# No runtime dependencies, on purpose. A telemetry library has no business
# adding a package to the dependency graph of the program it is measuring, so
# the transport is urllib.request rather than requests or httpx.
dependencies = []

[project.urls]
Homepage = "https://github.com/firstrun/firstrun"
Source = "https://github.com/firstrun/firstrun/tree/main/clients/python"

[tool.hatch.build.targets.wheel]
packages = ["src/firstrun"]

[tool.hatch.build.targets.sdist]
include = ["src/firstrun", "README.md", "pyproject.toml"]
