name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # The join tests run against real Postgres. A resolver that is correct in
    # memory and wrong over SQL is the one bug this project cannot afford, so
    # CI does not get to mock it either.
    services:
      postgres:
        image: postgres:17-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: firstrun
          POSTGRES_USER: firstrun
          POSTGRES_PASSWORD: firstrun
        options: >-
          --health-cmd "pg_isready -U firstrun -d firstrun"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgres://firstrun:firstrun@localhost:5432/firstrun

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # Before the tests, so a tag that blew its budget fails fast rather than
      # after the database round trips.
      - name: web tag size budget
        run: bun run check:size

      - run: bun run db:migrate

      - run: bun test

      - run: bun run typecheck

      # The build catches what the type checker cannot: a server-only import
      # that reached the client graph.
      - name: build
        run: bun run build

  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo test --manifest-path sdk/tauri/Cargo.toml
      - run: cargo clippy --manifest-path sdk/tauri/Cargo.toml --all-targets -- -D warnings
