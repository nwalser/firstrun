name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # The join tests run against a real ClickHouse on a throwaway database.
    # A resolver that is correct in memory and wrong over HTTP is the one bug
    # this project cannot afford, so CI does not get to mock it either.
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        ports:
          - 8123:8123
        env:
          CLICKHOUSE_DB: firstrun
          CLICKHOUSE_USER: firstrun
          CLICKHOUSE_PASSWORD: firstrun
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      CLICKHOUSE_URL: http://localhost:8123
      CLICKHOUSE_DB: firstrun
      CLICKHOUSE_USER: firstrun
      CLICKHOUSE_PASSWORD: firstrun
      SQLITE_PATH: ":memory:"

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # Before the tests, so a tag that blew its budget fails fast and loudly
      # rather than after four minutes of ClickHouse round trips.
      - name: web tag size budget
        run: bun run check:size

      - name: migrate
        run: bun run migrate

      - run: bun test

      - name: typecheck
        run: bun run typecheck

  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo test --manifest-path sdk/tauri/Cargo.toml
      - run: cargo clippy --manifest-path sdk/tauri/Cargo.toml --all-targets -- -D warnings
