services:
  postgres:
    image: postgres:17-alpine
    container_name: firstrun-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: firstrun
      POSTGRES_USER: firstrun
      POSTGRES_PASSWORD: firstrun
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firstrun -d firstrun"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
